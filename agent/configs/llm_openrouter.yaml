# OpenRouter 설정. 호출은 src/llm/client.py 한 곳. 사용: run.py / probe.py / batch_openrouter.py 에 --llm llm_openrouter
# 키는 저장소 루트 .env 의 OPENROUTER_API_KEY (.env.example 참조). 캐시 디렉터리 키 = model|seed 이므로 model 을 바꾸면 캐시가 분리된다.
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
model: openai/gpt-5.4-mini      # 배치 제출에도 :batch 접미사 없이 이 슬러그 그대로 (배치 엔드포인트가 배치 단가 적용)
temperature: 0.0
send_temperature: false         # OpenRouter 가 gpt-5.4-mini 지원 파라미터에 temperature 를 올리지 않음 (reasoning 계열). 지원 모델이면 true
seed: 42
send_seed: true                 # Anthropic 모델은 seed 미지원 → false
max_tokens: 300                 # reasoning 을 켜면 reasoning 토큰까지 이 한도에 포함 → 2000 이상으로 올릴 것
timeout_s: 120
retries: 3
rate_limit_wait_s: 20           # 429 시 대기. 신규 계정은 모델당 분당 20회 제한 (probe 2026-10-01 실측)
concurrency: 1                  # 동기 호출 경로(probe, run.py 의 캐시 미스)용. 분당 20회면 지연 2.2s 에서 1 이 최대. 제한 풀리면 8
json_mode: response_format      # vLLM guided_json 대응: response_format json_schema strict
strict: true
strict_strip: [maxLength]       # OpenAI strict 모드가 받지 않는 스키마 키. rationale 길이는 post_check 가 flag 로 기록
reasoning_effort: none          # none | minimal | low | medium | high. 비용의 최대 변수. probe 로 reasoning_tokens 0 확인
usage_include: true             # 응답 usage.cost (USD) 반환 → 실제 청구액 추적
# provider:                     # 여러 업체가 서빙하는 오픈웨이트 모델일 때만. OpenAI 모델은 단일 provider 라 불필요
#   order: [openai]
#   require_parameters: true
