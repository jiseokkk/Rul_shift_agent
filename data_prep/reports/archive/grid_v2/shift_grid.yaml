# Phase C 시나리오 grid (v3, 2026-09-16)
# 시나리오 수/unit = bias 24 + gain 21 (pos 12 + neg 9) + noise 9 + stuck 3 + multi 4 = 61 × 시점 4 = 244 → 20 unit = 4,880
#
# 2026-09-16 개정 (v2 → v3) — gain neg 의 α 를 1 미만으로 제한.
#   gain 은 x ← μ_r + (x − μ_r)(1 + d·α) 이므로 neg 에서 배율이 (1 − α) 이다.
#   α=1.0 neg 는 배율 0 → 센서가 μ_r 에 고정 (stuck 과 동일), α=1.5·2.0 neg 는 배율 음수 → 열화 방향 반전.
#   v2 grid 에서 gain neg α∈{1.0,1.5,2.0} 720 시나리오가 "gain" 이름으로 stuck·반전 고장을 담고 있었다
#   (검증: 주입 후 std 0 / 원본과 상관 −1.00). pos 는 (1 + α) 라 문제 없어 유지. v2 결과는 reports/archive/grid_v2.
#
# 2026-09-15 개정 — 1차 실행(구 grid)에서 저강도 구간이 전부 음성이라 α 범위를 올렸다.
#   구 grid 측정치(저하율):
#     bias  α=0.1 전 센서 0.00, α=0.2 도 T50(0.04) 외 0.00
#     gain  최대 0.13 (T50 α=0.5). 유형 자체가 성립 안 됨
#     noise β=0.5 전 센서 0.00
#   gain 은 평균 중심 스케일링이라 정규화 공간 편차가 ~1σ → 같은 α 에서 bias 보다 훨씬 약하다.
#   따라서 gain 의 α 는 bias 와 분리해 더 크게 잡는다.
#
# T30 에 대해: 주입은 정상(정규화 공간에서 정확히 α)이나 모델이 T30 에 둔감하다.
#   hold-out |Δŷ| (+0.5σ): T24 4.1~5.8, T50 4.2~6.0 vs T30 1.0~1.2 (seed 529/530/531 일관).
#   원인은 중복성 — T30 은 Ps30(r=.69) T50(.68) phi(−.67) P30(−.66) BPR(.64) 과 강상관.
#   제거하지 않고 음성 대조군으로 유지한다: "센서는 변했으나 모델은 저하되지 않은" 사례로,
#   에이전트가 알람을 울리면 안 되는 케이스다.

base_seed: 529                       # 시나리오별 rng seed 파생의 기준
timing_p: [0.2, 0.4, 0.6, 0.8]       # τ_s = round(t0 + p·(T_u − t0)), t0 = seq_len + N (agent.yaml)
sensors_single: [T24, T30, T50]      # raw 컬럼 6, 7, 8. 모두 모델 입력. T30 은 음성 대조군

types:
  bias:    {alpha: [0.3, 0.5, 0.75, 1.0], dir: [pos, neg]}
  gain:    {alpha: [0.5, 1.0, 1.5, 2.0],  dir: [pos, neg]}
  noise:   {beta:  [1.0, 2.0, 3.0]}
  stuck:   {}
  multi_C: {sets: [[T24, T30, T50]], alpha: [0.3, 0.5]}
  multi_I: {sets: [[T24, T30, T50]], alpha: [0.3, 0.5]}
